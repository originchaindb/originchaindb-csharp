name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "8.0"
          - os: windows-latest
            runtime: "8.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build OriginChainDB -c Release
      - name: HTTP contract
        run: python tests/contract/run.py -- dotnet run --project tests/Consumer
      - name: Build package
        run: dotnet pack OriginChainDB -c Release
      - name: Compile catalog example
        run: dotnet build examples/Catalog -c Release
