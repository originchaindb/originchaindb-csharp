name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "8.0"
          - os: windows-latest
            runtime: "8.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: 073b0396db55c903ca114f15fab8cf83c4b92e3d
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: Build
        run: dotnet build OriginChainDB -c Release
      - name: HTTP contract
        run: python tests/contract/run.py -- dotnet run --project tests/Consumer
      - name: Resilience contract
        run: python tests/contract/resilience.py -- dotnet run --project tests/Resilience
      - name: Build package
        run: dotnet pack OriginChainDB -c Release
      - name: Compile catalog example
        run: dotnet build examples/Catalog -c Release
      - name: Check application integration example
        run: dotnet build examples/Integration -c Release

      - name: Bounded iteration contract
        run: |
          python tests/contract/iteration.py -- dotnet run --project tests/Iteration -c Release
      - name: Public API compatibility
        run: |
          dotnet build scripts/ApiSurface -c Release
          python scripts/check_api.py -- dotnet scripts/ApiSurface/bin/Release/net8.0/ApiSurface.dll

  quality:
    name: Performance and package verification
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Prepare SDK and benchmark
        run: |
          dotnet build benchmarks/Consumer -c Release
          python -m pip install psutil==7.2.2
          mkdir -p artifacts
      - name: Build and install package candidate
        run: |
          dotnet pack OriginChainDB -c Release -o artifacts
          python scripts/verify_artifact.py
      - name: Measure transport and check performance baseline
        run: |
          python benchmarks/run.py --platform github-ubuntu24-x64 --baseline benchmarks/baseline.json --output benchmark-results.json  -- dotnet benchmarks/Consumer/bin/Release/net8.0/Consumer.dll
      - name: Record exact artifact hashes
        run: |
          python scripts/artifact_manifest.py
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-benchmark
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified package candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-verified-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Sign and verify build provenance
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sdk-verified-build
          path: artifacts
      - name: Attest verified build artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/*
          push-to-registry: false
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in artifacts/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Retain provenance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-build-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
